name: ci

on:
  pull_request:
  push:
    branches: [main]

# A force-push to an open PR cancels the run it superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `prisma generate`, which lib/generated/prisma needs —
      # the client is gitignored, so nothing typechecks without this. It never
      # opens a connection (prisma.config.ts resolves the URL lazily), so no
      # database secrets are needed anywhere in this workflow.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
